<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cap EcoTrail</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cap EcoTrail">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1511">
<style>
  html,body{margin:0;height:100%;background:#0E1511;transition:background-color .3s}
  iframe{position:fixed;top:0;left:0;width:1px;min-width:100%;max-width:100%;height:100%;border:0;background:transparent}
  #probe{position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
</style>
</head>
<body>
<div id="probe"></div>
<script>
(function(){
  var APP="https://script.google.com/macros/s/AKfycbyMrN0NWL6Qx7VEm3hNfz9lnu1QLQNm68_aKW-ygIJUgrfL-kc8xO05twunPGf-3Oah/exec";
  var p=getComputedStyle(document.getElementById("probe"));
  var sat=Math.round(parseFloat(p.paddingTop)||0), sab=Math.round(parseFloat(p.paddingBottom)||0);
  var f=document.createElement("iframe");
  f.title="Cap EcoTrail";f.allow="clipboard-write";
  f.src=APP+"?sat="+sat+"&sab="+sab;
  document.body.appendChild(f);
  try{var c=localStorage.getItem("cap-bg");if(c)document.body.style.background=document.documentElement.style.background=c}catch(e){}
  window.addEventListener("message",function(e){
    var d=e.data;if(!d||!d.capTheme)return;
    document.body.style.background=document.documentElement.style.background=d.capTheme;
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",d.capTheme);
    try{localStorage.setItem("cap-bg",d.capTheme)}catch(x){}
  });
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
